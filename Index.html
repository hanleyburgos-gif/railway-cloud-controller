<!DOCTYPE html>
<html>
<head>
    <title>RoniHub Cloud Controller</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f13; color: #fff; padding: 20px; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; }
        .status-box { background: #1a1a24; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #333; }
        textarea { width: 100%; height: 300px; background: #1a1a24; color: #00ffcc; border: 1px solid #333; padding: 15px; border-radius: 8px; font-family: monospace; box-sizing: border-box; outline: none; }
        textarea:focus { border-color: #00ffcc; }
        button { width: 100%; padding: 15px; background: #00ffcc; color: #000; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        button:disabled { background: #333; color: #666; }
        .agents-list { color: #00ffcc; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Cloud Script Controller</h2>
        <div class="status-box">
            <div>Connected Agents: <span id="agent-count">0</span></div>
            <div class="agents-list" id="agents">None</div>
        </div>
        <textarea id="script" placeholder="-- Paste your Lua script here..."></textarea>
        <button id="exec-btn" onclick="execute()">Execute on All Accounts</button>
        <div id="status" style="margin-top:15px; text-align:center; color:#aaa;"></div>
    </div>
    <script>
        setInterval(async () => {
            try {
                const res = await fetch('/api/agents');
                const agents = await res.json();
                document.getElementById('agent-count').innerText = agents.length;
                document.getElementById('agents').innerText = agents.length > 0 ? agents.join(', ') : 'None';
            } catch (e) {}
        }, 2000);

        async function execute() {
            const script = document.getElementById('script').value;
            if (!script) return alert("Paste a script first!");
            const btn = document.getElementById('exec-btn');
            const status = document.getElementById('status');
            btn.disabled = true;
            status.innerText = "Sending to agents...";
            try {
                const res = await fetch('/api/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ script })
                });
                const data = await res.json();
                status.style.color = '#00ffcc';
                status.innerText = `Successfully sent to ${data.sent} account(s).`;
            } catch (e) {
                status.style.color = '#ff4444';
                status.innerText = "Error sending script.";
            }
            btn.disabled = false;
        }
    </script>
</body>
</html>
